<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F2F4F6">
<title>QI 큐아이 · Active Docent</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
@property --c1 { syntax: '<color>'; inherits: true; initial-value: #F3FBF8; }
@property --c2 { syntax: '<color>'; inherits: true; initial-value: #9FD0C3; }
@property --c3 { syntax: '<color>'; inherits: true; initial-value: #F5CDB9; }

:root { --bg:linear-gradient(180deg,#F8FBFA 0%,#EBF4F1 100%); --ink:#1F2D2B; --mut:#6B7E7A; --line:#DCE8E4; --chip:#E9F2EF;
  --primary:#3F7468; --primary-soft:#CFE6DF; --jade:#8FC1B3; --peach:#F6D6C6; --mint:#D3EBDD; --sky:#A9D7E5; --shadow:0 8px 28px rgba(63,116,104,.13);
  --serif:"Noto Serif KR","Nanum Myeongjo","Apple Myungjo","AppleMyungjo","Batang",serif;
  --font: Pretendard, -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Hiragino Sans", "PingFang SC", "Noto Sans KR", "Noto Sans JP", "Noto Sans SC", "Segoe UI", sans-serif; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font); color: var(--ink); background:#e9e9ec; display:flex; align-items:center; justify-content:center; gap:28px; overflow:hidden; -webkit-font-smoothing:antialiased; user-select:none; -webkit-user-select:none; }
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
input { font: inherit; color: inherit; }

/* ---------- phone ---------- */
#box { position: relative; flex: none; }
#phone { position:absolute; left:0; top:0; width:393px; height:852px; transform-origin:0 0; background:#F2F7F5; border-radius:56px; overflow:hidden;
  box-shadow:0 0 0 10px #0f1b19, 0 30px 80px rgba(0,0,0,.22);
  --c1:#F3FBF8; --c2:#9FD0C3; --c3:#F5CDB9; transition: --c1 1.4s ease, --c2 1.4s ease, --c3 1.4s ease;
  --oy:-60px; --os:1; --ty:520px; }
#island { position:absolute; top:11px; left:50%; width:124px; height:36px; margin-left:-62px; background:#000; border-radius:20px; z-index:60; }
.scr { position:absolute; inset:0; display:none; flex-direction:column; background:var(--bg); animation:scrIn .45s ease both; }
@keyframes scrIn { from { opacity:0; transform:translateY(10px); } to { opacity:1; transform:none; } }
#phone[data-view="splash"] #v-splash, #phone[data-view="agent"] #v-agent, #phone[data-view="chat"] #v-chat, #phone[data-view="quiz"] #v-quiz,
#phone[data-view="puzzle"] #v-puzzle, #phone[data-view="collected"] #v-collected, #phone[data-view="dex"] #v-dex, #phone[data-view="detail"] #v-detail, #phone[data-view="card"] #v-card { display:flex; }
.safe { height: 62px; flex: none; }
.hdr { display:flex; align-items:center; gap:10px; padding:0 16px; height:52px; flex:none; }
.back { width:44px; height:44px; display:grid; place-items:center; border-radius:50%; flex:none; }
.back svg { width:22px; height:22px; }
.pillbtn { height:44px; padding:0 22px; border-radius:22px; background:#fff; border:1px solid var(--line); font-weight:600; font-size:15px; }
.btn { height:52px; padding:0 26px; border-radius:26px; background:#fff; box-shadow:0 6px 22px rgba(63,116,104,.12); font-size:16px; font-weight:600; min-width:200px; transition:transform .15s; }
.btn:active { transform:scale(.97); }
.btn.primary { background:var(--ink); color:#fff; } .btn.ghost { box-shadow:none; color:var(--mut); background:transparent; height:42px; min-width:0; font-weight:500; }
.btn.block { width:100%; } .btn.line { box-shadow:none; border:1px solid var(--line); }
.btn[disabled] { opacity:.35; pointer-events:none; }

/* ---------- splash ---------- */
#v-splash { background:radial-gradient(80% 50% at 85% 8%, rgba(246,214,198,.30), transparent 70%), radial-gradient(90% 55% at 10% 95%, rgba(169,215,229,.28), transparent 70%), linear-gradient(170deg,#2B4A44 0%,#3E6A60 52%,#5F978B 100%); color:#fff; align-items:center; justify-content:center; overflow:hidden; }
#v-splash::before { content:""; position:absolute; inset:-10%; opacity:.10; background-image:radial-gradient(circle at 50% 100%, transparent 0 18px, #fff 19px 20px, transparent 21px); background-size:40px 20px; -webkit-mask:linear-gradient(180deg,transparent 0%,#000 70%); mask:linear-gradient(180deg,transparent 0%,#000 70%); }
#v-splash .orbmark { width:150px; height:150px; border-radius:50%; margin:0 auto 34px; background:radial-gradient(circle at 38% 32%,#fff 0%,#EAF7F2 38%,#9FD0C3 100%); box-shadow:0 0 70px 14px rgba(190,235,222,.38), inset 0 0 22px 6px rgba(255,255,255,.7); animation:breathe 6s ease-in-out infinite; }
#v-splash .mark { text-align:center; margin-top:-30px; }
#v-splash .kr { font-family:var(--serif); font-size:31px; font-weight:700; letter-spacing:-.6px; }
#v-splash .qi { font-family:var(--serif); font-size:15px; letter-spacing:6px; opacity:.85; margin-top:18px; text-transform:uppercase; }
#v-splash .en { font-size:13px; font-weight:600; letter-spacing:.3px; margin-top:6px; opacity:.9; }
#v-splash .tag { margin-top:26px; font-size:13px; line-height:1.6; opacity:.7; text-align:center; max-width:230px; }
#v-splash .btn { position:absolute; left:16px; right:16px; bottom:48px; background:rgba(255,255,255,.94); color:var(--primary); box-shadow:0 10px 30px rgba(0,0,0,.18); font-weight:700; }
#v-splash .lang { position:absolute; top:70px; right:20px; display:flex; gap:6px; }
#v-splash .lang button { padding:5px 9px; border-radius:12px; font-size:12px; font-weight:600; color:#cfcfcf; border:1px solid #4a4a4a; }
#v-splash .lang button.on { background:#fff; color:var(--ink); border-color:#fff; }

/* ---------- orb ---------- */
#orb { position:absolute; left:50%; top:50%; width:240px; height:240px; margin:-120px 0 0 -120px; transform:translateY(var(--oy)) scale(var(--os)); transition:transform 1s cubic-bezier(.3,.7,.2,1), opacity .8s; z-index:2; pointer-events:none; }
.o-glow { position:absolute; inset:-34px; border-radius:50%; filter:blur(26px); opacity:.75; background:radial-gradient(circle, color-mix(in srgb, var(--c2) 55%, transparent) 0%, transparent 68%); }
.o-breath { position:absolute; inset:0; animation:breathe var(--bd,6s) ease-in-out infinite; }
.o-lvl { position:absolute; inset:0; transform:scale(calc(1 + var(--lvl,0) * .16)); }
.o-body { position:absolute; inset:20px; border-radius:50%; overflow:hidden;
  background:radial-gradient(circle at 40% 34%, #ffffff 0%, var(--c1) 34%, var(--c2) 100%);
  box-shadow:inset 0 0 30px 8px rgba(255,255,255,.75), inset -12px -16px 34px color-mix(in srgb, var(--c2) 55%, transparent), inset 14px 10px 26px rgba(150,205,215,.38);
  animation:morph 7s ease-in-out infinite alternate; }
#camvideo { position:absolute; left:0; top:0; width:2px; height:2px; opacity:0; pointer-events:none; }
/* the camera is only a faint, blurred reflection in a convex-mirror mapping on the orb (see initMirror) */
#mirror { position:absolute; inset:0; width:100%; height:100%; border-radius:50%; opacity:0; mix-blend-mode:multiply; transition:opacity 1.6s ease; pointer-events:none; }
#phone[data-cam="1"] #mirror { opacity:var(--mo,.55); }
.o-gloss { position:absolute; inset:0; border-radius:50%; pointer-events:none;
  background:radial-gradient(circle at 34% 24%, rgba(255,255,255,.85) 0%, rgba(255,255,255,0) 42%), radial-gradient(circle at 60% 90%, color-mix(in srgb, var(--c3) 40%, transparent) 0%, transparent 55%); }
.o-rim { position:absolute; inset:15px; border-radius:50%; filter:blur(2.2px); opacity:.6; background:conic-gradient(from 0deg,#BFE6DC,#A9D7E5,#F6D6C6,var(--c3),#BFE6DC);
  -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 9px), #000 calc(100% - 8px)); mask:radial-gradient(farthest-side, transparent calc(100% - 9px), #000 calc(100% - 8px)); animation:spin 11s linear infinite; }
.o-arcs { position:absolute; inset:0; width:100%; height:100%; filter:blur(.7px); }
.o-arcs .a1 { transform-origin:120px 120px; animation:spin 13s linear infinite; } .o-arcs .a2 { transform-origin:120px 120px; animation:spin 19s linear infinite reverse; }
.o-watch { position:absolute; inset:2px; border-radius:50%; border:1.5px dashed color-mix(in srgb, var(--c2) 70%, #000 10%); opacity:0; transition:opacity .6s; animation:spin 16s linear infinite; }
.o-prog { position:absolute; inset:0; border-radius:50%; opacity:0; transition:opacity .3s; background:conic-gradient(var(--c2) calc(var(--prog,0) * 1%), transparent 0);
  -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5px)); mask:radial-gradient(farthest-side, transparent calc(100% - 6px), #000 calc(100% - 5px)); }
#phone[data-watch="1"] .o-watch { opacity:.55; } #phone[data-state="signal"] .o-watch { opacity:1; border-style:solid; }
#phone[data-state="question"][data-hold="1"] .o-prog { opacity:1; }
#phone[data-talk="1"] { --bd:1.5s; } #phone[data-state="signal"] { --bd:2.6s; } #phone[data-state="guide"] { --bd:1.2s; } #phone[data-state="question"] { --bd:4s; }
#phone[data-sub="ask"]      { --oy:-215px; --os:.6;  --ty:270px; }
#phone[data-sub="consent"]  { --oy:-250px; --os:.5;  --ty:215px; }
#phone[data-sub="main"]     { --oy:-70px;  --os:1;   --ty:500px; }
#phone[data-sub="question"] { --oy:-165px; --os:.68; --ty:385px; }
#phone[data-quiet="1"] #orb { opacity:.6; } #phone[data-quiet="1"][data-sub="main"] { --os:.62; }
@keyframes breathe { 0%,100% { transform:scale(1); } 50% { transform:scale(1.045); } }
@keyframes spin { to { transform:rotate(360deg); } }
@keyframes morph { 0% { border-radius:50% 50% 48% 52% / 52% 48% 52% 48%; } 50% { border-radius:46% 54% 53% 47% / 49% 53% 47% 51%; } 100% { border-radius:53% 47% 46% 54% / 47% 52% 48% 53%; } }
/* mini orb */
.morb { border-radius:50%; flex:none; position:relative; background:radial-gradient(circle at 38% 32%, #fff 0%, var(--c1) 38%, var(--c2) 100%);
  box-shadow:inset 0 0 8px 2px rgba(255,255,255,.8), 0 0 0 1.5px color-mix(in srgb, var(--c3) 45%, transparent); animation:breathe 5s ease-in-out infinite; }
.morb.talk { animation:breathe 1.1s ease-in-out infinite; }


/* ---------- QI character ---------- */
.qi-char { position:absolute; inset:0; } .qiav svg, .qi-char svg { width:100%; height:100%; display:block; overflow:visible; }
.morb.qiav, .orbmark.qiav, .b-orb.qiav { background:none !important; box-shadow:none !important; border-radius:0 !important; animation:none !important; }
#v-splash .orbmark.qiav { width:176px; height:176px; margin-bottom:26px; filter:drop-shadow(0 18px 34px rgba(0,0,0,.28)); } .b-orb.qiav { width:124px; height:124px; filter:drop-shadow(0 14px 26px rgba(0,0,0,.25)); }
#orb .o-gloss, #orb .o-rim, #orb .o-arcs { display:none; } #orb .o-body { background:none; box-shadow:none; animation:none; overflow:visible; } #orb .o-body > video, #orb .o-body > canvas { opacity:0; pointer-events:none; }
.o-glow { background:radial-gradient(circle, rgba(159,208,195,.55) 0%, transparent 66%) !important; }
.qi-bob { animation:qiBob 4.4s ease-in-out infinite; } @keyframes qiBob { 50% { transform:translateY(-4px); } }
.qi-head { transform-box:fill-box; transform-origin:50% 80%; } .qi-eye, .qi-talk { transform-box:fill-box; transform-origin:center; }
.qi-eye { animation:qiBlink 5.6s infinite; } @keyframes qiBlink { 0%,93%,100% { transform:scaleY(1); } 96% { transform:scaleY(.08); } }
.qi-talk { opacity:0; } #phone[data-speak="1"] .qi-smile { opacity:0; } #phone[data-speak="1"] .qi-talk { opacity:1; animation:qiMouth .32s ease-in-out infinite alternate; }
@keyframes qiMouth { from { transform:scale(.78,.3); } to { transform:scale(1.08,1.15); } }
#phone[data-speak="1"] .qi-head { animation:qiNod 1.7s ease-in-out infinite; } @keyframes qiNod { 0%,100% { transform:translateY(10px) rotate(-1.3deg); } 50% { transform:translateY(11px) rotate(1.5deg); } }
#phone[data-state="signal"] .qi-eye { animation:none; transform:scale(1.1,1.18); } #phone[data-quiet="1"] .qi-eye { animation:none; transform:scaleY(.5); }
/* conversation thread */
.msg.chdiv { align-self:stretch; max-width:100%; background:transparent !important; border:0 !important; box-shadow:none; display:flex; align-items:center; gap:10px; padding:8px 0 2px; font-size:12px; color:var(--mut); }
.msg.chdiv::before, .msg.chdiv::after { content:""; flex:1; height:1px; background:var(--line); } .msg.chdiv img { width:36px; height:36px; border-radius:10px; object-fit:cover; flex:none; }
.msg.chdiv div { display:flex; flex-direction:column; align-items:flex-start; line-height:1.3; } .msg.chdiv b { color:var(--ink); font-size:12.5px; }
.msg .mimg { display:block; width:100%; max-height:150px; object-fit:cover; border-radius:12px; margin-bottom:8px; }
#v-chat.nostory .narr, #v-chat.nostory #tabs, #v-chat.nostory #chat-min { display:none; }
#timechip { pointer-events:auto; cursor:pointer; } #timechip .tc { display:inline-block; margin-top:2px; padding:2px 9px; border-radius:11px; background:rgba(63,116,104,.1); color:var(--primary); font-weight:600; font-size:11.5px; }
.qimg { display:block; width:calc(100% - 32px); height:112px; margin:2px 16px 0; border-radius:18px; object-fit:cover; background:var(--chip); }

/* ---------- agent view ---------- */
#top { position:absolute; top:62px; left:20px; right:20px; display:flex; justify-content:space-between; align-items:center; z-index:6; }
.round { width:48px; height:48px; border-radius:50%; background:#fff; box-shadow:0 6px 22px rgba(63,116,104,.13); display:grid; place-items:center; flex:none; }
.round svg { width:22px; height:22px; } .round.dark { background:var(--primary); color:#fff; } .round.on { background:var(--primary); color:#fff; }
#timechip { font-size:12.5px; color:var(--mut); text-align:center; line-height:1.35; min-width:0; }
#timechip b { color:var(--ink); font-size:14px; font-variant-numeric:tabular-nums; }
body:not(.demo) #simbar, body:not(.demo) #hud-lab, body:not(.demo) #labopen, body:not(.demo) #lab { display:none !important; }   /* developer tools: only with ?demo=1 or Shift+D */
#boot { position:fixed; inset:0; z-index:999; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; background:linear-gradient(160deg,#1B64DA,#3182F6); color:#fff; transition:opacity .7s ease, visibility .7s; text-align:center; }
#boot.off { opacity:0; visibility:hidden; pointer-events:none; } #boot b { font-family:var(--serif); font-size:26px; letter-spacing:.5px; font-weight:600; } #boot span { font-size:13px; opacity:.75; letter-spacing:.4px; }
.b-orb { width:84px; height:84px; border-radius:50%; margin-bottom:12px; background:radial-gradient(circle at 34% 30%, #fff, #bfe3d8 55%, #7fb8a8); box-shadow:0 0 50px rgba(255,255,255,.35); animation:bootbreath 2.2s ease-in-out infinite; } @keyframes bootbreath { 50% { transform:scale(1.07); box-shadow:0 0 70px rgba(255,255,255,.5); } }
#labclose { display:inline-flex !important; }
#labopen { display:none; position:absolute; top:118px; right:20px; z-index:6; height:30px; padding:0 12px; border-radius:15px; background:#fff; box-shadow:0 4px 14px rgba(63,116,104,.13); font-size:12px; font-weight:600; }
#nowplaying { display:none; position:absolute; left:20px; right:20px; top:122px; z-index:7; align-items:center; gap:6px; padding:10px 10px 10px 18px; border-radius:22px; background:rgba(255,255,255,.94); box-shadow:var(--shadow); backdrop-filter:blur(10px); }
#phone[data-np="1"] #nowplaying { display:flex; animation:scrIn .35s ease both; }
#nowplaying .npm { flex:1; min-width:0; } #nowplaying em { font-style:normal; font-size:11px; font-weight:700; color:var(--primary); letter-spacing:.3px; display:block; } #nowplaying b { display:block; font-size:14.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; } #nowplaying span { font-size:12px; color:var(--mut); display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.npbar { height:3px; border-radius:2px; background:var(--chip); margin-top:6px; overflow:hidden; } .npbar i { display:block; height:100%; width:0; background:var(--primary); transition:width .3s; }
#nowplaying button { width:38px; height:38px; border-radius:50%; background:var(--chip); font-size:14px; font-weight:700; color:var(--primary); flex:none; }
.donecard { flex-wrap:wrap; } .donecard .dcb { display:flex; gap:8px; margin-left:auto; } .donecard button.alt { background:var(--chip); color:var(--ink); }
.skiplink { display:block; margin:10px auto 0; padding:8px 14px; font-size:14px; font-weight:600; color:var(--mut); text-decoration:underline; }
#tz { position:absolute; left:0; right:0; top:var(--ty); padding:0 26px; display:flex; flex-direction:column; align-items:center; gap:10px; z-index:5; transition:top .9s cubic-bezier(.3,.7,.2,1); }
#say { margin:0; font-size:22px; line-height:1.4; font-weight:600; text-align:center; letter-spacing:-.4px; min-height:31px; word-break:keep-all; transition:opacity .35s; }
#sub { margin:0; font-size:13.5px; line-height:1.5; color:var(--mut); text-align:center; min-height:20px; word-break:keep-all; }
#actions { display:flex; flex-direction:column; gap:8px; width:100%; align-items:center; margin-top:4px; }
#pane-time { display:none; flex-direction:column; gap:10px; width:100%; margin-top:6px; }
#phone[data-sub="ask"] #pane-time { display:flex; }
#chips { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; }
.chip { height:54px; border-radius:18px; background:#fff; box-shadow:0 6px 22px rgba(63,116,104,.12); font-size:16px; font-weight:700; line-height:1.15; } .chip.wide { width:100%; height:48px; font-size:15px; font-weight:600; } .chip small { display:block; font-size:10.5px; font-weight:500; color:var(--mut); margin-top:3px; } .chip:active { transform:scale(.97); }
#slider-row { display:flex; align-items:center; gap:10px; } #slider-row input { flex:1; accent-color:var(--ink); } #slider-row output { min-width:50px; text-align:right; font-weight:600; font-size:14px; font-variant-numeric:tabular-nums; }
#slider-row .go { height:36px; padding:0 14px; border-radius:18px; background:var(--ink); color:#fff; font-size:13px; font-weight:600; }
#consent { display:none; width:100%; background:#fff; border-radius:24px; padding:18px; box-shadow:0 8px 30px rgba(63,116,104,.13); text-align:center; }
#phone[data-sub="consent"] #consent { display:block; } #phone[data-sub="consent"] #actions { display:none; }
#consent h4 { margin:0 0 8px; font-size:17px; } #consent p { margin:0 0 14px; font-size:13px; color:var(--mut); line-height:1.55; }
#consent .row2 { display:flex; gap:8px; justify-content:center; } #consent .btn { min-width:0; flex:1; height:46px; font-size:15px; }
#simbar { position:absolute; left:20px; right:20px; bottom:92px; display:none; z-index:6; }
#phone[data-simbar="1"] #simbar { display:block; }
#simbar button { width:100%; height:46px; border-radius:23px; border:1.5px dashed #b5b5ba; font-size:13.5px; font-weight:600; color:#4a4a4f; background:rgba(255,255,255,.85); }
#simbar button.on { background:var(--primary); color:#fff; border-style:solid; border-color:var(--primary); }
#bottom { position:absolute; left:16px; right:16px; bottom:30px; display:flex; gap:8px; align-items:center; z-index:6; }
.askpill { flex:1; height:52px; border-radius:26px; background:#fff; box-shadow:0 6px 22px rgba(63,116,104,.13); display:flex; align-items:center; gap:6px; padding:0 8px 0 4px; min-width:0; }
.askpill .plus { width:40px; height:40px; display:grid; place-items:center; flex:none; } .askpill .plus svg { width:22px; height:22px; }
.askpill input { flex:1; border:0; outline:0; background:transparent; font-size:15px; min-width:0; user-select:text; -webkit-user-select:text; } .askpill input::placeholder { color:#a2a2a7; }
#sendbtn { width:34px; height:34px; border-radius:50%; background:var(--primary); color:#fff; display:none; place-items:center; flex:none; } #sendbtn.show { display:grid; } #sendbtn svg { width:16px; height:16px; }
#bottom .round { width:52px; height:52px; }
.wave { display:inline-flex; gap:2px; align-items:center; height:16px; } .wave i { width:2.5px; height:6px; border-radius:2px; background:#fff; animation:wv .8s ease-in-out infinite; } .wave i:nth-child(2){animation-delay:.15s} .wave i:nth-child(3){animation-delay:.3s} @keyframes wv { 50% { height:15px; } }

/* ---------- sheets ---------- */
.sheet { position:absolute; left:0; right:0; bottom:0; background:#fff; border-radius:30px 30px 0 0; padding:14px 24px 34px; z-index:40; transform:translateY(105%); transition:transform .45s cubic-bezier(.3,.7,.2,1); box-shadow:0 -10px 40px rgba(0,0,0,.14); max-height:84%; overflow:auto; }
.sheet.open { transform:none; } .sheet h3 { margin:6px 0 14px; font-size:19px; letter-spacing:-.3px; } .grab { width:40px; height:4px; border-radius:2px; background:#ddd; margin:0 auto 8px; }
#scrim { position:absolute; inset:0; background:rgba(0,0,0,.28); opacity:0; pointer-events:none; transition:opacity .3s; z-index:39; } #scrim.on { opacity:1; pointer-events:auto; }
.row { display:flex; align-items:center; justify-content:space-between; padding:13px 0; border-bottom:1px solid var(--line); gap:12px; font-size:15px; } .row:last-child { border-bottom:0; }
.row small { display:block; color:var(--mut); font-size:12px; margin-top:2px; line-height:1.4; max-width:215px; }

.msg.typing { color:#aaa; letter-spacing:3px; }
.donecard { align-self:stretch; border:1.5px dashed #c8c8ce; border-radius:18px; padding:12px 14px; display:flex; align-items:center; justify-content:space-between; gap:10px; font-size:13.5px; font-weight:600; animation:pop .35s ease; }

.inrow { display:flex; gap:8px; } .inrow input { flex:1; height:44px; border-radius:22px; border:0; background:var(--chip); padding:0 18px; font-size:14.5px; outline:0; user-select:text; -webkit-user-select:text; } .inrow .mic { width:44px; height:44px; border-radius:50%; background:var(--primary); color:#fff; display:grid; place-items:center; flex:none; } .inrow .mic svg { width:20px; height:20px; } .inrow .mic.on { box-shadow:0 0 0 5px rgba(80,160,140,.28); }

/* ---------- quiz / puzzle ---------- */
.qhead { display:flex; align-items:center; gap:12px; padding:0 16px; height:48px; flex:none; } .qhead .pbar { flex:1; height:8px; border-radius:4px; background:var(--line); overflow:hidden; } .qhead .pbar i { display:block; height:100%; background:var(--primary); width:0; transition:width .4s; } .qhead span { font-size:13px; font-weight:600; font-variant-numeric:tabular-nums; min-width:34px; text-align:right; }

.ans b { width:28px; height:28px; border-radius:50%; background:var(--chip); display:grid; place-items:center; font-size:12px; flex:none; }
.ans.sel { border-color:var(--primary); border-width:2px; } .ans.ok { background:var(--primary); color:#fff; border-color:var(--primary); } .ans.ok b { background:#fff; color:var(--ink); } .ans.bad { border-color:#c0392b; color:#c0392b; }

#pgrid { margin:6px 16px 0; padding:4px; border-radius:20px; background:var(--chip); display:grid; grid-template-columns:repeat(3,1fr); gap:4px; }

.tile.img { background-size:300% 300%; } .tile .n { position:absolute; left:8px; top:6px; font-size:11px; opacity:.55; }
.tile.empty { background:#fff; border:2px dashed #b9b9bf; color:#8a8a90; cursor:pointer; } .tile.empty.target { border-color:var(--primary); background:var(--chip); } .tile.shake { animation:shk .25s; }

/* ---------- collected ---------- */

.dcard .t { display:flex; justify-content:space-between; font-size:11px; color:var(--mut); font-weight:600; } .dcard .art { height:200px; margin:12px 0; border-radius:18px; background:var(--chip); display:grid; place-items:center; } .dcard .art .morb { width:150px; height:150px; animation-duration:4s; }

/* ---------- dex ---------- */

.dexhead { display:flex; justify-content:space-between; align-items:flex-end; padding:8px 16px 4px; } .dexhead h1 { margin:0; font-size:26px; letter-spacing:-.6px; } .dexhead span { font-size:12.5px; color:var(--mut); }

.dx .im img { width:100%; height:100%; object-fit:cover; border-radius:11px; } .dhero { height:230px; overflow:hidden; margin:0 16px; border-radius:24px; background:var(--chip); display:grid; place-items:center; } .dhero .morb { width:160px; height:160px; animation-duration:4.5s; }
.dinfo { padding:20px 16px 0; } .dinfo small { font-size:12px; color:var(--mut); font-weight:600; } .dinfo h1 { margin:6px 0 12px; font-size:24px; letter-spacing:-.5px; line-height:1.3; }
.tagrow { display:flex; gap:6px; flex-wrap:wrap; } .tagrow span { padding:6px 12px; border-radius:14px; background:var(--chip); font-size:12px; font-weight:600; }

/* ---------- taste card ---------- */
#v-card { align-items:center; text-align:center; padding:0 24px; }
#v-card .morb { width:110px; height:110px; margin-top:92px; animation-duration:4s; } #v-card h2 { margin:22px 0 0; font-size:30px; letter-spacing:-.8px; } #v-card p { margin:10px 0 0; color:var(--mut); font-size:14px; line-height:1.6; max-width:300px; word-break:keep-all; }

/* ---------- haptics fallback ---------- */
@keyframes shake { 0%,100% { transform:translate(0,0); } 20% { transform:translate(-3px,1px); } 40% { transform:translate(3px,-1px); } 60% { transform:translate(-2px,-1px); } 80% { transform:translate(2px,1px); } }

.lbtn { display:inline-flex; align-items:center; justify-content:center; height:34px; padding:0 11px; border-radius:10px; background:var(--chip); font-size:12.5px; font-weight:600; margin:0 6px 6px 0; } .lbtn.on { background:var(--primary); color:#fff; } .lbtn kbd { font:600 10px var(--font); margin-left:6px; opacity:.55; }

/* ---------- 3D world mode (first-person museum behind the phone) ---------- */
#world { position:fixed; inset:0; width:100vw; height:100vh; display:none; z-index:0; background:#eceef2; }
#hud { position:fixed; inset:0; z-index:3; pointer-events:none; display:none; font-size:13px; }
body.world #world, body.world #hud { display:block; }
body.world { display:block; background:#eceef2; }

#xhair::before { content:""; position:absolute; left:50%; top:50%; width:6px; height:6px; margin:-3px 0 0 -3px; border-radius:50%; background:#fff; box-shadow:0 0 0 1.5px rgba(0,0,0,.45); }
#xhair::after { content:""; position:absolute; inset:0; border-radius:50%; background:conic-gradient(rgba(26,26,26,.85) calc(var(--gz,0) * 1%), rgba(255,255,255,.0) 0);
  -webkit-mask:radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px)); mask:radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px)); }

#ctrlhint small { display:block; color:#777; font-weight:500; margin-top:2px; }
#minimap { position:absolute; left:20px; bottom:20px; width:120px; height:240px; border-radius:14px; background:rgba(255,255,255,.85); box-shadow:0 6px 22px rgba(0,0,0,.12); }

#itemcard { position:absolute; left:190px; bottom:104px; width:430px; display:flex; gap:16px; align-items:center; padding:14px; border-radius:22px; background:rgba(255,255,255,.93); backdrop-filter:blur(10px); box-shadow:0 14px 40px rgba(31,45,43,.28); opacity:0; transform:translateY(14px); transition:opacity .45s, transform .45s; pointer-events:none; }
#itemcard p { display:none; } #itemcard.on { opacity:1; transform:none; } #itemcard img { width:96px; height:96px; border-radius:14px; object-fit:cover; flex:none; background:#e9f2ef; }
#itemcard em { font-style:normal; font-size:12px; font-weight:700; color:var(--primary); letter-spacing:.3px; } #itemcard b { display:block; font-size:17px; margin:2px 0 4px; line-height:1.3; } #itemcard p { margin:0; font-size:13.5px; line-height:1.5; color:#4a5d59; }
#hud-lab { position:absolute; left:20px; top:92px; pointer-events:auto; height:32px; padding:0 14px; border-radius:16px; background:rgba(255,255,255,.88); font-size:12.5px; font-weight:600; box-shadow:0 4px 14px rgba(0,0,0,.1); }

@media (max-width:860px) and (min-width:481px) { #lab { display:none; } #lab.open { display:block; position:fixed; right:12px; top:12px; z-index:80; } #labopen { display:inline-block; } #labclose { display:inline-flex; } }
@media (max-width:480px) {
  body { display:block; background:var(--bg); } #box { width:100vw !important; height:100dvh !important; }
  #phone { width:100vw; height:100dvh; border-radius:0; box-shadow:none; transform:none !important; } #island { display:none; }

  if (S.started) { if (S.quiz && !S.quiz.done) s = t('stQuiz'); else if (S.puz && !S.puz.over) s = t('stPuzzle'); else if (S.chat && !S.chat.finished) s = t('stExplain')(Math.min(S.chat.idx + 1, S.chat.total), S.chat.total);
    else if (S.speaking) s = t('stSpeaking'); else if (['observe', 'signal', 'guide', 'question'].includes(S.state)) s = t('stLooking'); else s = t('stListening'); }
  const e = $('#hstat'); if (e && e.textContent !== s) e.textContent = s;
  const c = S.chat; if (c && c.bar && c.bar.isConnected) { const lines = (ART[c.id].story[S.set.lang] || ART[c.id].story.en).length; let frac = c.finished ? 1 : (c.idx + (c.cur ? Math.min(1, (performance.now() - c.cur.start) / Math.max(1, c.cur.est)) : 0)) / lines; c.bar.querySelector('.bar i').style.width = Math.min(100, frac * 100) + '%'; }
}
setInterval(renderStatus, 250);
function renderHero() {
  const box = $('#hero-chips'); if (!box) return; box.innerHTML = '';
  [[t('chipToday'), () => { startFree(); setTimeout(() => { addMsg('me', t('chipToday')); qiReply(t('todayReply')); }, 500); }], [t('chipLang'), () => { const i = LANGS.indexOf(S.set.lang); setLang(LANGS[(i + 1) % LANGS.length]); }], [t('chipVoice'), () => { startFree(); setTimeout(toggleVoice, 400); }]]
    .forEach(([label, fn], i) => { const c = mk('button', 'chipx'); c.textContent = label; c.onclick = e => { e.stopPropagation(); unlockAudio(); fn(); }; box.appendChild(c); });
}

/* ---- starting ---- */
function startFree() {
  unlockAudio(); play('greet'); haptic([30], .2); stopSpeak(); setView('agent');
  S.minutes = 0; S.free = true; S.remaining = 0; S.warned10 = false; S.done = new Set(); S.unlockedGaya = true; S.course = ['gogu', 'baek', 'absent', 'gaya', 'silla']; S.started = true; S.clockOn = false; S.near = null; S.rec = null; S.chat = null; S.quiz = null; S.puz = null; S.asks = {};
  progEl = {}; setState('idle'); renderCourse(); renderTime(); renderLab(); phone.dataset.started = '1'; $('#msgs').innerHTML = ''; removeNudge();
  const g = t('hello') + ' ' + t('exploreFree'); addMsg('qa', g); speak(g); if (S.set.cam && !S.camOn && !S.camConsentAsked) setTimeout(askConsent, 2600); renderSim(); log('free tour started');
}
function plan() { startFree(); }

/* ---- story ---- */
function chatDivider(id) { const a = ART[id], im = dexImg(id); addMsg('chdiv', `${im ? `<img src="${im}" alt="">` : '<span class="ph32"></span>'}<div><b>${esc(L(a.name))}</b><span>${esc(t('nations')[id])}</span></div>`, false); }
function npBar(c) {
  const b = mk('div', 'tcard card-np'); b.innerHTML = `<button class="pp" aria-label="play">${ICON_PAUSE}</button><div class="meta"><span class="lbl"></span><div class="bar"><i></i></div></div>`;
  b.querySelector('.pp').onclick = e => { e.stopPropagation(); unlockAudio(); if (c.finished) { c.finished = false; c.idx = 0; c.dur = 0; setPP(true); renderNP(); narrateNext(c); return; } const p = S.chatPlaying !== false; pauseSpeak(p); setPP(!p); renderNP(); }; return b;
}
function renderNP() { const c = S.chat; if (!c || !c.bar) return; const total = c.total; c.bar.querySelector('.lbl').textContent = c.finished ? t('npDone') : t('chapter')(Math.min(c.idx + 1, total), total); c.bar.querySelector('.pp').innerHTML = (c.finished || S.chatPlaying === false) ? ICON_PLAY : ICON_PAUSE; }
function openChat(id) {
  const a = ART[id]; S.last = id; S.near = id; stopSpeak(); removeNudge(); setView('agent');
  const c = S.chat = { id, idx: 0, total: a.story.en.length, finished: false, dur: 0, cur: null }; S.chatMini = false; setPP(true); chatDivider(id); addMsg('hint', `${EYE}<span>${esc(L(a.hint))}</span>`, false);
  c.bar = put(npBar(c)); renderNP(); log('story: ' + id); setTimeout(() => narrateNext(c), 600);
}
function narrateNext(c) {
  if (S.chat !== c) return; const a = ART[c.id], lines = a.story[S.set.lang] || a.story.en; if (c.idx >= lines.length) return storyDone(c);
  const txt = lines[c.idx]; addMsg('qa', txt); put(c.bar); renderNP(); if (c.idx === 0) { play(a.sound, .5); haptic(a.vib, a.shake * .5); } if (c.idx + 1 >= Math.ceil(lines.length / 2) && c.idx > 0) addPiece(c.id, 'listen');
  c.cur = { start: performance.now(), est: speechEst(txt) }; c.dur += speechEst(txt);
  const vp = a.voice && a.nation === 'gogu' && c.idx === lines.length - 1 ? { ...a.voice, rate: a.voice.rate + .07, pitch: a.voice.pitch + .1 } : a.voice;
  speak(txt, () => { if (S.chat !== c) return; c.idx++; setTimeout(() => narrateNext(c), 350); }, vp);
}
function storyDone(c) { c.finished = true; c.cur = null; markSeen(c.id); renderNP(); if (S.state === 'explain') setState('cooldown'); addPiece(c.id, 'listen'); setTimeout(() => { if (S.chat === c) offerNext(c.id); }, 800); }
function setPP(play) { S.chatPlaying = play; }

/* ---- Dex pieces ---- */
const PKEYS = ['listen', 'ask', 'quiz', 'puz'];
const pcs = id => (S.prog[id] && S.prog[id].pieces) || {}, pcount = id => PKEYS.filter(k => pcs(id)[k]).length;
let progEl = {};
function fillProgress(c, id) {
  const a = ART[id], n = pcount(id), P = pcs(id);
  c.innerHTML = `<div class="ph2"><div><em>${esc(t('piecesLead'))}</em><b>${esc(L(a.name))}</b></div><span class="cnt">${Math.min(n, 3)} / 3</span></div><div class="steps">${PKEYS.map(k => `<div class="step ${P[k] ? 'done' : ''}"><i>${P[k] ? ICON_CHECK : ''}</i><span>${esc(t('step_' + k))}</span></div>`).join('')}</div><p>${esc(t('piecesNote'))}</p>`;
}
function showProgress(id) { if (progEl[id]) progEl[id].remove(); const c = mk('div', 'tcard card-prog'); fillProgress(c, id); progEl[id] = put(c); }
function refreshProgress(id) { if (progEl[id] && progEl[id].isConnected) fillProgress(progEl[id], id); }
function addPiece(id, key) {
  if (!ART[id]) return; const p = S.prog[id] = S.prog[id] || {}; p.pieces = p.pieces || {}; const had = !!p.pieces[key]; p.pieces[key] = true; save(); refreshProgress(id); if (had) return; const n = pcount(id);
  if (!p.date) { if (n >= 3) setTimeout(() => awardDex(id), 700); else if (key !== 'listen' || n > 1) addMsg('hint', t('gotPiece')(n)); }
}
function offerNext(id) {
  const p = S.prog[id] || {}; if (p.date) return; addMsg('qa', t('needPieces')); showProgress(id); const items = [];
  if (!pcs(id).quiz) items.push([t('chipQuizGo'), () => startQuiz(id)]); if (!pcs(id).ask) items.push([t('chipAskGo'), () => askChips(id, true)]); if (!pcs(id).puz) items.push([t('chipPuzzleGo'), () => startPuzzle(id)]);
  if (items.length) chipRow(items);
}
const ASKKEYS = [['who', 'chipWho'], ['why', 'chipWhy'], ['simple', 'chipSimple'], ['fun', 'chipFun']];
function askChips(id, lead) {
  S.asked = S.asked || {}; const used = S.asked[id] = S.asked[id] || new Set(); const left = ASKKEYS.filter(([k]) => !used.has(k)); if (!left.length) return; if (lead) addMsg('qa', t('askLead'));
  chipRow(left.map(([k, lab]) => [t(lab), () => userAsk(t(lab), k)]));
}
function awardDex(id) {
  const a = ART[id], p = S.prog[id] = S.prog[id] || {}; if (p.date) return; const pts = 120 + (p.quiz || 0) * 20 + (pcs(id).puz ? 30 : 0);
  p.date = new Date().toLocaleDateString(S.set.lang === 'en' ? 'en-US' : S.set.lang, { month: 'short', day: 'numeric' }); p.pts = pts; S.done.add(id); save(); renderCourse(); renderTime(); play('ok', 1); haptic([30, 40, 30], .3);
  const msg = t('pieceDone'); addMsg('qa', msg); speak(msg, null, a.voice); const im = dexImg(id), c = mk('div', 'tcard card-get');
  c.innerHTML = `<em>${esc(t('dexGot'))}</em><div class="art">${im ? `<img src="${im}" alt="">` : ''}</div><div><small>No. ${String(a.no).padStart(3, '0')} · ${esc(t('nations')[id])}</small><h3>${esc(L(a.name))}</h3><p>${esc(t('types')[id])}</p></div>`;
  const row = mk('div', 'acts'); row.style.width = '100%'; row.appendChild(mkBtn(t('viewDex'), 'primary', () => openDex())); row.appendChild(mkBtn(t('keepTalking'), 'weak', () => { row.remove(); askChips(id, false); })); c.appendChild(row); put(c);
}

/* ---- questions ---- */
function userAsk(text, forced, noEcho, idOverride) {
  const id = idOverride || (S.chat ? S.chat.id : S.last), a = id && ART[id]; const dl = detectLang(text); if (dl && dl !== S.set.lang && !forced) setLang(dl, true);
  if (!noEcho) addMsg('me', text); let key = forced; if (!key && a) key = Object.keys(KW).find(k => KW[k].test(text)); if (!key && converse(text)) return;
  const typing = addMsg('qa typing', '···'); stopSpeak();
  setTimeout(() => { typing.remove(); const ans = key && a ? L(a[key]) : (a ? t('noAnswer') : t('fallbackMsg')); addMsg('qa', ans); speak(ans, null, a ? a.voice : undefined);
    if (key && a) { S.asked = S.asked || {}; (S.asked[id] = S.asked[id] || new Set()).add(key); S.asks = S.asks || {}; S.asks[id] = (S.asks[id] || 0) + 1; if (S.asks[id] >= 2) addPiece(id, 'ask'); if (!(S.prog[id] && S.prog[id].date)) setTimeout(() => askChips(id, false), 500); } }, 650);
}
async function handleAsk(text) {
  const isLangReq = LANGREQ.some(([rx]) => rx.test(text)); const dl = detectLang(text); if (dl && dl !== S.set.lang && !isLangReq) setLang(dl, true); if (!S.started) startFree();
  addMsg('me', text); if (converse(text)) return; const id = S.chat ? S.chat.id : (S.near || S.last); if (id && ART[id]) return userAsk(text, undefined, true, id);
  const r = await askLLM(text); qiReply(r || t('fallbackMsg'));
}

/* ---- quiz as a card ---- */
function prepSquare(id, cb) { const src = dexImg(id); if (!src || SQ[id]) return cb && cb(); const im = new Image(); im.onload = () => { try { const sz = Math.min(im.width, im.height), c = document.createElement('canvas'); c.width = c.height = 420; c.getContext('2d').drawImage(im, (im.width - sz) / 2, (im.height - sz) / 2, sz, sz, 0, 0, 420, 420); SQ[id] = c.toDataURL('image/jpeg', .86); } catch (e) {} cb && cb(); }; im.onerror = () => cb && cb(); im.src = src; }
function startQuiz(id) {
  prepSquare(id); stopSpeak(); S.quiz = { id, i: 0, sel: -1, right: 0, checked: false, done: false }; addMsg('qa', t('quizLead')); speak(t('quizLead'), null, ART[id].voice); S.quiz.card = put(mk('div', 'tcard card-quiz')); drawQuiz();
}
function drawQuiz() {
  const z = S.quiz, a = ART[z.id], q = a.quiz[z.i], n = a.quiz.length, im = dexImg(z.id), c = z.card; z.sel = -1; z.checked = false;
  c.innerHTML = `${im ? `<img class="qimg" src="${im}" alt="">` : ''}<div class="qh"><em>${esc(t('qLabel')(z.i + 1))}</em><span>${z.i + 1} / ${n}</span></div><h3>${esc(L(q.q))}</h3><div class="opts"></div><div class="fbk"></div>`;
  const box = c.querySelector('.opts'), cta = mkBtn(t('check'), 'primary block', () => {
    if (z.checked) { z.i++; z.i >= n ? endQuiz() : drawQuiz(); return; } z.checked = true; const ok = z.sel === q.a; if (ok) z.right++;
    box.querySelectorAll('.opt').forEach((x, j) => { x.classList.remove('sel'); if (j === q.a) x.classList.add('ok'); else if (j === z.sel) x.classList.add('bad'); }); c.querySelector('.fbk').textContent = ok ? t('right') : t('wrong'); play(ok ? 'ok' : 'no', 1); cta.textContent = z.i + 1 >= n ? t('seeResult') : t('next'); }); cta.disabled = true;
  (q.o[S.set.lang] || q.o.en).forEach((txt, k) => { const b = mk('button', 'opt'); b.innerHTML = `<i>${'ABCD'[k]}</i><span></span>`; b.querySelector('span').textContent = txt; b.onclick = () => { if (z.checked) return; z.sel = k; box.querySelectorAll('.opt').forEach((x, j) => x.classList.toggle('sel', j === k)); cta.disabled = false; }; box.appendChild(b); });
  c.appendChild(cta); const m = $('#msgs'); requestAnimationFrame(() => { m.scrollTop = m.scrollHeight; });
}
function endQuiz() {
  const z = S.quiz, a = ART[z.id], n = a.quiz.length; z.done = true; z.card.innerHTML = `<div class="qsum"><em>${esc(t('qLabel2'))}</em><b>${z.right} / ${n}</b></div>`; z.card.style.padding = '16px 20px';
  const p = S.prog[z.id] = S.prog[z.id] || {}; p.quiz = Math.max(z.right, p.quiz || 0); p.quizN = n; save(); const msg = z.right > 0 ? t('quizGood')(z.right, n) : t('quizTry'); addMsg('qa', msg); speak(msg, null, a.voice); if (z.right > 0) addPiece(z.id, 'quiz');
  setTimeout(() => { if (!(S.prog[z.id] && S.prog[z.id].date)) offerNext(z.id); }, 1200);
}

/* ---- puzzle as a card ---- */
function startPuzzle(id) {
  stopSpeak(); const miss = [4, 6].sort(() => Math.random() - .5); S.puz = { id, miss, placed: {}, sel: null, t0: Date.now(), sec: 0, over: false }; addMsg('qa', t('puzzleLead')); S.puz.card = put(mk('div', 'tcard card-puz')); drawPuzzle(); prepSquare(id, () => { if (S.puz && S.puz.id === id && !S.puz.over) drawPuzzle(); });
}
const tileBg = (id, k) => { const r = Math.floor(k / 3), c = k % 3, sq = SQ[id]; return sq ? `background-image:url(${sq});background-size:300% 300%;background-position:${c * 50}% ${r * 50}%;` : `background:${['#D8CFB8', '#CBBF9F', '#E2DAC6'][(k + r) % 3]};`; };
function drawPuzzle() {
  const p = S.puz, c = p.card, rest = p.miss.filter(k => !p.placed[k]).sort((x, y) => x - y);
  c.innerHTML = `<div class="qh2"><em>${esc(t('tabPuzzle'))}</em><b>${esc(t('puzzleTitle'))}</b></div><div class="pgrid"></div><div class="ptray"><span>${esc(t('piecesLeftLabel'))}</span></div>`;
  const g = c.querySelector('.pgrid'); for (let k = 0; k < 9; k++) { const el = mk('div', 'tile'); if (p.miss.includes(k) && !p.placed[k]) { el.className = 'tile empty' + (p.sel != null ? ' target' : ''); el.textContent = '?'; el.onclick = () => placePiece(k); } else el.setAttribute('style', tileBg(p.id, k)); g.appendChild(el); }
  const tray = c.querySelector('.ptray'); rest.forEach(k => { const b = mk('button', 'pc' + (p.sel === k ? ' sel' : '')); b.setAttribute('style', tileBg(p.id, k)); b.textContent = k + 1; b.onclick = () => { p.sel = p.sel === k ? null : k; drawPuzzle(); }; tray.appendChild(b); });
  const sk = mk('button', 'skiplink'); sk.textContent = t('skipPuzzle'); sk.onclick = () => endPuzzle(false); c.appendChild(sk);
}
function placePiece(slot) {
  const p = S.puz; if (p.sel == null) return; const tiles = p.card.querySelectorAll('.tile');
  if (p.sel === slot) { p.placed[slot] = true; p.sel = null; play('ok', .8); if (p.miss.every(k => p.placed[k])) return endPuzzle(true); drawPuzzle(); } else { play('no', .8); tiles[slot].classList.add('shake'); p.sec += 5; haptic([40], .3); setTimeout(() => tiles[slot] && tiles[slot].classList.remove('shake'), 300); }
}
function endPuzzle(done) {
  const p = S.puz; if (!p || p.over) return; p.over = true; const secs = Math.round((Date.now() - p.t0) / 1000) + p.sec; p.card.innerHTML = `<div class="qsum"><em>${esc(t('tabPuzzle'))}</em><b>${done ? mm(secs) : '—'}</b></div>`; p.card.style.padding = '16px 20px';
  if (done) { const pr = S.prog[p.id] = S.prog[p.id] || {}; pr.puz = Math.min(secs, pr.puz || 1e9); save(); addMsg('qa', t('puzzleDone')); addPiece(p.id, 'puz'); }
  setTimeout(() => { if (!(S.prog[p.id] && S.prog[p.id].date)) offerNext(p.id); }, 1200);
}
function finishQuiz() {} function renderQuiz() {} function renderPuzzle() {} function collect(id) { awardDex(id); }

/* ---- free-browsing exhibits: QI introduces them with a photo card ---- */
function qiIntroduce(id) {
  const e = EXHMAP[id]; if (!e || !S.started || S.view !== 'agent') return false; if (!['idle', 'observe', 'cooldown', 'quiet'].includes(S.state) || (S.speaking && !S.intro)) return false;
  const tok = S.introTok = (S.introTok || 0) + 1; S.intro = true; const c = mk('div', 'tcard card-art');
  c.innerHTML = `<img src="${EXH_IMG(id)}" alt=""><div class="body"><div class="tag"><b>${esc(t('nations')[e.nation])}</b></div><h3>${esc(L(e.name))}</h3><p>${esc(L(e.note))}</p></div>`; put(c);
  speak(L(e.name) + '. ' + L(e.note), () => { if (S.introTok === tok) S.intro = false; }, NVOICE[e.nation] || QIVOICE); log('QI introduced free exhibit: ' + id); return true;
}

/* ---- Dex screen + detail ---- */
function openDex() { closeSheets(); setView('dex'); renderDex(); }
function renderDex() {
  const ids = dexIds(), got = ids.filter(dexGot).length; $('#dex-count').textContent = t('dexCount')(got, ids.length); $('#dex-bar').style.width = Math.max(2, got / ids.length * 100) + '%';
  const f = $('#dex-filters'); f.innerHTML = ''; FILTERS.forEach(([k]) => { const b = mk('button', 'chipx' + (S.dexFilter === k ? ' on' : '')); b.textContent = k === 'all' ? t('all') : t('nations')[k]; b.onclick = () => { S.dexFilter = k; renderDex(); }; f.appendChild(b); });
  const grid = $('#dexgrid'); grid.innerHTML = '';
  ids.forEach((id, i) => { if (S.dexFilter !== 'all' && dexNation(id) !== S.dexFilter) return; const no = 'No. ' + String(i + 1).padStart(3, '0'), el = mk('button', 'dx');
    if (dexGot(id)) { const img = dexImg(id); el.innerHTML = `<div class="im">${img ? `<img src="${img}" alt="">` : ''}</div><small>${no}</small><b></b>`; el.querySelector('b').textContent = dexName(id); el.onclick = () => openDetail(id); }
    else { const n = ART[id] ? pcount(id) : 0; el.className = 'dx ' + (n ? 'prog' : 'lock'); el.innerHTML = `<div class="im">?</div><small>${no}</small><b>${n ? esc(t('pieceN')(n)) : esc(t('notFound'))}</b>`; }
    grid.appendChild(el); });
}
function openDetail(id) { S.detailId = id; setView('detail'); renderDetail(id); }
function renderDetail(id) {
  if (!id) return; const ex = EXHMAP[id], a = ART[id], p = S.prog[id] || {}, ids = dexIds(), no = 'No. ' + String(ids.indexOf(id) + 1).padStart(3, '0'), im = dexImg(id);
  $('#det-hero').innerHTML = im ? `<img src="${im}" alt="">` : ''; $('#det-no').textContent = `${no} · ${t('collectedOn')(p.date || '')}`; $('#det-name').textContent = dexName(id);
  $('#det-tags').innerHTML = ex ? `<span>${esc(t('nations')[ex.nation])}</span>` : `<span>${esc(t('nations')[id])}</span><span>${esc(t('types')[id])}</span>${a.absent ? `<span>${esc(t('elsewhere'))}</span>` : ''}`;
  $('#det-story').textContent = ex ? L(ex.note) : (a.story[S.set.lang] || a.story.en).join('\n'); const pc = $('#det-pieces'); if (a) { pc.style.display = ''; fillProgress(pc, id); } else pc.style.display = 'none';
}
function talkAbout(id) {
  setView('agent'); const ex = EXHMAP[id]; if (ex) { addMsg('qa', L(ex.note)); speak(L(ex.name) + '. ' + L(ex.note), null, NVOICE[ex.nation]); return; }
  S.near = S.last = id; chatDivider(id); addMsg('qa', t('askLead')); const items = ASKKEYS.map(([k, lab]) => [t(lab), () => userAsk(t(lab), k, false, id)]); items.push([t('storyAgain'), () => openChat(id)]); chipRow(items);
}

/* ---- wiring ---- */
$('#btn-start').onclick = e => { e.stopPropagation(); startFree(); };
$('#btn-dex').onclick = e => { e.stopPropagation(); openDex(); }; $('#dex-back').onclick = () => setView('agent'); $('#det-back').onclick = () => { setView('dex'); renderDex(); };
$('#det-talk').onclick = () => talkAbout(S.detailId); $('#btn-taste').onclick = () => { closeSheets(); showCard(); };
$('#m-dex').onclick = openDex;
setView('agent'); applyI18n(); renderStatus();
